<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-label="How I build: Request, Agent, Tools and RAG, Cloud, Shipped">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#05070f"/><stop offset="1" stop-color="#0b1022"/></linearGradient>
    <linearGradient id="rail" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
    <linearGradient id="cardG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171d3a"/><stop offset="1" stop-color="#0c1127"/></linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9" stop-opacity="0"/><stop offset=".5" stop-color="#67e8f9"/><stop offset="1" stop-color="#67e8f9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="c"><rect width="1200" height="300" rx="24"/></clipPath>
    <style>
      .f{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
      .m{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
      .h{font-size:19px;font-weight:800;fill:#eef2ff}
      .s{font-size:12.5px;fill:#94a3b8}
      .n{font-size:11px;font-weight:800;letter-spacing:2px;fill:#67e8f9}
      .card{fill:url(#cardG);stroke:#26305a;stroke-width:1.5}
      .hot{animation:ring 6s ease-in-out infinite}
      .c1{animation-delay:0s}.c2{animation-delay:1.2s}.c3{animation-delay:2.4s}.c4{animation-delay:3.6s}.c5{animation-delay:4.8s}
      .pk{filter:url(#glow)}
      .p1{animation:travel 6s linear infinite}.p2{animation:travel 6s linear infinite;animation-delay:2s}.p3{animation:travel 6s linear infinite;animation-delay:4s}
      .bars rect{animation:eq 1.1s ease-in-out infinite alternate;transform-origin:bottom;transform-box:fill-box}
      .bars rect:nth-child(2){animation-delay:.15s}.bars rect:nth-child(3){animation-delay:.3s}.bars rect:nth-child(4){animation-delay:.45s}.bars rect:nth-child(5){animation-delay:.6s}
      .g1{animation:spin 7s linear infinite;transform-box:fill-box;transform-origin:center}
      .g2{animation:spin 4.5s linear infinite reverse;transform-box:fill-box;transform-origin:center}
      .cloud{animation:float 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .chk{stroke-dasharray:46;stroke-dashoffset:46;animation:draw 6s ease-out infinite}
      .okring{animation:okpulse 6s ease-out infinite;transform-box:fill-box;transform-origin:center}
      .cur{animation:blink 1s steps(2) infinite}
      .cmd{transform-box:fill-box;transform-origin:left center;animation:type 6s steps(16) infinite}
      .node{animation:nd 2s ease-in-out infinite}
      .node:nth-child(2){animation-delay:.3s}.node:nth-child(3){animation-delay:.6s}.node:nth-child(4){animation-delay:.9s}
      @keyframes travel{0%{transform:translateX(0);opacity:0}4%{opacity:1}96%{opacity:1}100%{transform:translateX(980px);opacity:0}}
      @keyframes ring{0%,100%{stroke:#26305a}10%{stroke:#67e8f9}26%{stroke:#26305a}}
      @keyframes eq{from{transform:scaleY(.25)}to{transform:scaleY(1)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
      @keyframes draw{0%,80%{stroke-dashoffset:46}92%,100%{stroke-dashoffset:0}}
      @keyframes okpulse{0%,80%{transform:scale(1);opacity:1}92%{transform:scale(1.5);opacity:0}100%{transform:scale(1.5);opacity:0}}
      @keyframes blink{to{opacity:0}}
      @keyframes type{0%{transform:scaleX(0)}20%{transform:scaleX(1)}100%{transform:scaleX(1)}}
      @keyframes nd{0%,100%{opacity:.35}50%{opacity:1}}
    </style>
  </defs>

  <g clip-path="url(#c)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect x="0" y="0" width="1200" height="2" fill="url(#edge)" opacity=".7"/>

    <!-- rail -->
    <path d="M110 170 H1090" stroke="url(#rail)" stroke-width="5" stroke-linecap="round" opacity=".55"/>
    <g class="pk">
      <circle class="p1" cx="110" cy="170" r="7" fill="#67e8f9"/>
      <circle class="p2" cx="110" cy="170" r="7" fill="#c4b5fd"/>
      <circle class="p3" cx="110" cy="170" r="7" fill="#f9a8d4"/>
    </g>

    <!-- 1 Request -->
    <g transform="translate(40,80)">
      <rect class="card hot c1" width="190" height="150" rx="18"/>
      <text class="f n" x="20" y="30">01</text>
      <text class="f h" x="20" y="58">Request</text>
      <text class="f s" x="20" y="80">user · event · API</text>
      <g class="m" font-size="13" fill="#67e8f9">
        <text x="20" y="122">$</text>
        <g class="cmd"><text x="34" y="122">ship the agent</text></g>
        <rect class="cur" x="150" y="110" width="7" height="14" fill="#67e8f9"/>
      </g>
    </g>

    <!-- 2 Agent -->
    <g transform="translate(270,80)">
      <rect class="card hot c2" width="190" height="150" rx="18"/>
      <text class="f n" x="20" y="30">02</text>
      <text class="f h" x="20" y="58">Agent</text>
      <text class="f s" x="20" y="80">plan · reason · route</text>
      <g transform="translate(135,118)">
        <g class="g1"><circle r="20" fill="none" stroke="#c4b5fd" stroke-width="4" stroke-dasharray="6 5"/></g>
        <g class="g2"><circle r="10" fill="none" stroke="#67e8f9" stroke-width="3" stroke-dasharray="4 3"/></g>
        <circle r="3.5" fill="#fff"/>
      </g>
    </g>

    <!-- 3 Tools + RAG -->
    <g transform="translate(500,80)">
      <rect class="card hot c3" width="190" height="150" rx="18"/>
      <text class="f n" x="20" y="30">03</text>
      <text class="f h" x="20" y="58">Tools + RAG</text>
      <text class="f s" x="20" y="80">MCP · APIs · vectors</text>
      <g class="bars" transform="translate(100,134)">
        <rect x="0" y="-36" width="9" height="36" rx="2" fill="#67e8f9"/>
        <rect x="14" y="-36" width="9" height="36" rx="2" fill="#c4b5fd"/>
        <rect x="28" y="-36" width="9" height="36" rx="2" fill="#f9a8d4"/>
        <rect x="42" y="-36" width="9" height="36" rx="2" fill="#6ee7b7"/>
        <rect x="56" y="-36" width="9" height="36" rx="2" fill="#fcd34d"/>
      </g>
    </g>

    <!-- 4 Cloud -->
    <g transform="translate(730,80)">
      <rect class="card hot c4" width="190" height="150" rx="18"/>
      <text class="f n" x="20" y="30">04</text>
      <text class="f h" x="20" y="58">Cloud</text>
      <text class="f s" x="20" y="80">AWS · GCP · scale</text>
      <g class="cloud" transform="translate(112,100)">
        <path d="M14 36h40a14 14 0 0 0 2-27.8A20 20 0 0 0 18 14a11 11 0 0 0-4 22z" fill="none" stroke="#67e8f9" stroke-width="3" stroke-linejoin="round"/>
        <g fill="#c4b5fd">
          <circle class="node" cx="22" cy="24" r="3"/><circle class="node" cx="34" cy="24" r="3"/><circle class="node" cx="46" cy="24" r="3"/><circle class="node" cx="58" cy="24" r="3"/>
        </g>
      </g>
    </g>

    <!-- 5 Shipped -->
    <g transform="translate(960,80)">
      <rect class="card hot c5" width="190" height="150" rx="18"/>
      <text class="f n" x="20" y="30">05</text>
      <text class="f h" x="20" y="58">Shipped</text>
      <text class="f s" x="20" y="80">measured outcome</text>
      <g transform="translate(135,118)">
        <circle class="okring" r="22" fill="none" stroke="#6ee7b7" stroke-width="3"/>
        <circle r="22" fill="none" stroke="#6ee7b7" stroke-width="3"/>
        <path class="chk" d="M-11 1l8 8 15-16" fill="none" stroke="#6ee7b7" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <text class="f" x="600" y="272" text-anchor="middle" font-size="12" fill="#64748b" letter-spacing="3">EVERY SYSTEM I DESIGN FOLLOWS THIS PATH</text>
  </g>
</svg>
