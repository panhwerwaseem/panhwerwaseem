<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Muhammad Waseem Panhwar — Senior AI Solution Architect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05070f"/><stop offset="1" stop-color="#0c1226"/>
    </linearGradient>
    <linearGradient id="txt" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#67e8f9"><animate attributeName="stop-color" values="#67e8f9;#c4b5fd;#f9a8d4;#67e8f9" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset=".5" stop-color="#c4b5fd"><animate attributeName="stop-color" values="#c4b5fd;#f9a8d4;#67e8f9;#c4b5fd" dur="7s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#f9a8d4"><animate attributeName="stop-color" values="#f9a8d4;#67e8f9;#c4b5fd;#f9a8d4" dur="7s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity=".55"/><stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="aurA" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7c3aed" stop-opacity=".75"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <radialGradient id="aurB" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#06b6d4" stop-opacity=".7"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></radialGradient>
    <radialGradient id="aurC" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ec4899" stop-opacity=".5"/><stop offset="1" stop-color="#ec4899" stop-opacity="0"/></radialGradient>
    <radialGradient id="core" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#fff"/><stop offset=".25" stop-color="#a5f3fc"/><stop offset=".6" stop-color="#7c3aed" stop-opacity=".6"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="28"/></filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8b9cf7" stroke-opacity=".07"/></pattern>
    <clipPath id="frame"><rect width="1200" height="420" rx="26"/></clipPath>
    <path id="orb1" d="M0,-150 a150,150 0 1,1 -0.1,0 z"/>
    <path id="orb2" d="M0,-105 a105,105 0 1,0 0.1,0 z"/>
    <path id="orb3" d="M0,-60 a60,60 0 1,1 -0.1,0 z"/>
    <style>
      .f{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
      .mono{font-family:'JetBrains Mono','Fira Code',Consolas,monospace}
      .eyebrow{font-size:14px;letter-spacing:5px;font-weight:700;fill:#67e8f9}
      .name{font-size:62px;font-weight:900;letter-spacing:-2px;fill:url(#txt)}
      .typed{font-size:21px;fill:#dbe2ff;font-weight:500}
      .caret{fill:#67e8f9;animation:blink 1s steps(2) infinite}
      .chip{font-size:12.5px;font-weight:700;fill:#05070f}
      .lbl{font-size:11px;font-weight:700;letter-spacing:1.5px;fill:#a5b4fc}
      .in{animation:rise 1.2s cubic-bezier(.2,.8,.2,1) both}
      .i1{animation-delay:.1s}.i2{animation-delay:.35s}.i3{animation-delay:.6s}.i4{animation-delay:.85s}
      .chipA{animation:pop .7s cubic-bezier(.2,1.2,.3,1.1) both;transform-box:fill-box;transform-origin:center}
      .k1{animation-delay:1.1s}.k2{animation-delay:1.25s}.k3{animation-delay:1.4s}.k4{animation-delay:1.55s}.k5{animation-delay:1.7s}
      .line{transform-box:fill-box;transform-origin:left center;transform:scaleX(0)}
      .l1{transform:scaleX(1);animation:type 12s steps(44) infinite both}
      .l2{animation:type 12s steps(44) infinite both;animation-delay:4s}
      .l3{animation:type 12s steps(44) infinite both;animation-delay:8s}
      .a1{animation:driftA 14s ease-in-out infinite alternate}
      .a2{animation:driftB 18s ease-in-out infinite alternate}
      .a3{animation:driftC 11s ease-in-out infinite alternate}
      .ring{fill:none;transform-box:fill-box;transform-origin:center}
      .r1{animation:spin 26s linear infinite}
      .r2{animation:spin 17s linear infinite reverse}
      .r3{animation:spin 9s linear infinite}
      .pulse{animation:pulse 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
      .beat{animation:beat 2.6s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
      .star{animation:tw 3.4s ease-in-out infinite}
      .scan{animation:scan 7s linear infinite}
      .shine{animation:shine 5s ease-in-out infinite}
      @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:translateY(0)}}
      @keyframes pop{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
      @keyframes type{0%{transform:scaleX(0)}18%{transform:scaleX(1)}30%{transform:scaleX(1)}33.3%{transform:scaleX(0)}100%{transform:scaleX(0)}}
      @keyframes blink{to{opacity:0}}
      @keyframes driftA{from{transform:translate(0,0) scale(1)}to{transform:translate(120px,40px) scale(1.25)}}
      @keyframes driftB{from{transform:translate(0,0) scale(1.1)}to{transform:translate(-90px,-50px) scale(.9)}}
      @keyframes driftC{from{transform:translate(0,0)}to{transform:translate(60px,-70px)}}
      @keyframes spin{to{transform:rotate(360deg)}}
      @keyframes pulse{0%{transform:scale(.6);opacity:.9}100%{transform:scale(2.4);opacity:0}}
      @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
      @keyframes tw{0%,100%{opacity:.15}50%{opacity:1}}
      @keyframes scan{from{transform:translateY(-40px)}to{transform:translateY(460px)}}
      @keyframes shine{0%{transform:translateX(-700px)}60%,100%{transform:translateX(900px)}}
    </style>
  </defs>

  <g clip-path="url(#frame)">
    <rect width="1200" height="420" fill="url(#bg)"/>
    <rect width="1200" height="420" fill="url(#grid)"/>

    <!-- aurora -->
    <g filter="url(#soft)">
      <ellipse class="a1" cx="200" cy="90" rx="260" ry="150" fill="url(#aurA)"/>
      <ellipse class="a2" cx="1000" cy="360" rx="300" ry="170" fill="url(#aurB)"/>
      <ellipse class="a3" cx="650" cy="420" rx="220" ry="110" fill="url(#aurC)"/>
    </g>

    <!-- scanline -->
    <rect class="scan" x="0" y="0" width="1200" height="36" fill="url(#shine)" opacity=".08"/>

    <!-- stars -->
    <g fill="#e0e7ff">
      <circle class="star" cx="120" cy="360" r="1.6"/><circle class="star" cx="460" cy="48" r="1.3" style="animation-delay:.6s"/>
      <circle class="star" cx="610" cy="300" r="1.8" style="animation-delay:1.2s"/><circle class="star" cx="300" cy="200" r="1.1" style="animation-delay:1.8s"/>
      <circle class="star" cx="1120" cy="70" r="1.5" style="animation-delay:2.4s"/><circle class="star" cx="760" cy="120" r="1.2" style="animation-delay:3s"/>
      <circle class="star" cx="1160" cy="380" r="1.4" style="animation-delay:.9s"/><circle class="star" cx="40" cy="60" r="1.2" style="animation-delay:2.1s"/>
    </g>

    <!-- ===== left: text ===== -->
    <g class="f">
      <text class="eyebrow in i1" x="72" y="118">SENIOR AI SOLUTION ARCHITECT</text>
      <g class="in i2">
        <text class="name" x="68" y="190">Muhammad Waseem</text>
        <text class="name" x="68" y="252">Panhwar</text>
        <rect class="shine" x="0" y="140" width="220" height="120" fill="url(#shine)" opacity=".35" style="mix-blend-mode:overlay"/>
      </g>

      <!-- typed lines -->
      <g class="in i3">
        <text class="mono" x="72" y="300" font-size="20" fill="#67e8f9">&gt;</text>
        <g class="line l1"><text class="typed f" x="96" y="300">I build AI agents that actually ship to production.</text></g>
        <g class="line l2"><text class="typed f" x="96" y="300">RAG · LangGraph · MCP · LLM platforms · AWS · GCP.</text></g>
        <g class="line l3"><text class="typed f" x="96" y="300">Co-founder, ActionMind AI — meetings that run themselves.</text></g>
        <rect class="caret" x="640" y="284" width="3" height="20"/>
      </g>

      <!-- chips -->
      <g class="in i4">
        <g class="chipA k1"><rect x="72" y="330" width="104" height="32" rx="16" fill="#67e8f9"/><text class="chip" x="124" y="351" text-anchor="middle">AI Agents</text></g>
        <g class="chipA k2"><rect x="186" y="330" width="66" height="32" rx="16" fill="#c4b5fd"/><text class="chip" x="219" y="351" text-anchor="middle">RAG</text></g>
        <g class="chipA k3"><rect x="262" y="330" width="130" height="32" rx="16" fill="#f9a8d4"/><text class="chip" x="327" y="351" text-anchor="middle">LLM Platforms</text></g>
        <g class="chipA k4"><rect x="402" y="330" width="104" height="32" rx="16" fill="#6ee7b7"/><text class="chip" x="454" y="351" text-anchor="middle">AWS · GCP</text></g>
        <g class="chipA k5"><rect x="516" y="330" width="130" height="32" rx="16" fill="#fcd34d"/><text class="chip" x="581" y="351" text-anchor="middle">15+ yrs shipping</text></g>
      </g>
    </g>

    <!-- ===== right: neural core ===== -->
    <g transform="translate(960,210)">
      <circle r="190" fill="url(#core)" opacity=".18"/>
      <!-- rings -->
      <circle class="ring r1" r="150" stroke="#a78bfa" stroke-opacity=".35" stroke-width="1" stroke-dasharray="3 9"/>
      <circle class="ring r2" r="105" stroke="#67e8f9" stroke-opacity=".45" stroke-width="1.2" stroke-dasharray="14 10"/>
      <circle class="ring r3" r="60" stroke="#f9a8d4" stroke-opacity=".6" stroke-width="1.5" stroke-dasharray="2 6"/>
      <!-- orbiters -->
      <g filter="url(#glow)">
        <circle r="6" fill="#67e8f9"><animateMotion dur="11s" repeatCount="indefinite"><mpath href="#orb1"/></animateMotion></circle>
        <circle r="4" fill="#c4b5fd"><animateMotion dur="11s" begin="-5.5s" repeatCount="indefinite"><mpath href="#orb1"/></animateMotion></circle>
        <circle r="5" fill="#f9a8d4"><animateMotion dur="7s" repeatCount="indefinite"><mpath href="#orb2"/></animateMotion></circle>
        <circle r="3.5" fill="#6ee7b7"><animateMotion dur="7s" begin="-3.5s" repeatCount="indefinite"><mpath href="#orb2"/></animateMotion></circle>
        <circle r="4" fill="#fff"><animateMotion dur="4s" repeatCount="indefinite"><mpath href="#orb3"/></animateMotion></circle>
      </g>
      <!-- labels on ring -->
      <g class="f lbl">
        <text x="0" y="-162" text-anchor="middle">AGENTS</text>
        <text x="158" y="4" text-anchor="start">RAG</text>
        <text x="0" y="172" text-anchor="middle">CLOUD</text>
        <text x="-158" y="4" text-anchor="end">LLMs</text>
        <text x="112" y="-112" text-anchor="start">MCP</text>
        <text x="-112" y="122" text-anchor="end">DATA</text>
      </g>
      <!-- core -->
      <circle class="pulse" r="30" fill="none" stroke="#67e8f9" stroke-width="2"/>
      <circle class="pulse" r="30" fill="none" stroke="#c4b5fd" stroke-width="2" style="animation-delay:1.3s"/>
      <circle class="beat" r="34" fill="url(#core)"/>
      <text class="f" x="0" y="7" text-anchor="middle" font-size="19" font-weight="900" fill="#05070f">AI</text>
    </g>
  </g>
</svg>
