<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 340" width="1200" height="340" role="img" aria-label="Muhammad Waseem Panhwar — Senior AI Solution Architect">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="100%" stop-color="#141a33"/>
    </linearGradient>
    <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0"/>
      <stop offset="50%" stop-color="#22d3ee" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="50%" stop-color="#a78bfa"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowP" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a78bfa" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
    <style>
      .t  { font-family: 'Segoe UI', Inter, Roboto, Helvetica, Arial, sans-serif; }
      .title { font-size: 54px; font-weight: 800; letter-spacing: -1px; fill: url(#title); }
      .sub   { font-size: 20px; font-weight: 500; fill: #c7d2fe; }
      .tag   { font-size: 13px; font-weight: 600; fill: #0b1020; }
      .link  { stroke: #38bdf8; stroke-width: 1.6; fill: none; stroke-dasharray: 6 10; animation: flow 1.6s linear infinite; opacity: .75; }
      .link.p { stroke: #a78bfa; animation-duration: 2.2s; }
      .node  { fill: #0b1020; stroke: #22d3ee; stroke-width: 2; }
      .node.p { stroke: #a78bfa; }
      .pulse { fill: none; stroke: #22d3ee; stroke-width: 2; opacity: 0; animation: pulse 2.4s ease-out infinite; }
      .pulse.p { stroke: #a78bfa; }
      .orb   { animation: drift 9s ease-in-out infinite alternate; }
      .orb2  { animation: drift 12s ease-in-out infinite alternate-reverse; }
      .sweep { animation: sweep 6s linear infinite; }
      .fade  { animation: fadeUp 1.1s ease-out both; }
      .d1 { animation-delay: .15s } .d2 { animation-delay: .45s } .d3 { animation-delay: .75s } .d4 { animation-delay: 1.05s }
      .pill { animation: pop .6s cubic-bezier(.2,.9,.3,1.4) both; transform-origin: center; }
      .p1 { animation-delay: 1.2s } .p2 { animation-delay: 1.35s } .p3 { animation-delay: 1.5s } .p4 { animation-delay: 1.65s } .p5 { animation-delay: 1.8s }
      .spin { animation: spin 14s linear infinite; transform-origin: 960px 170px; }
      .spinR { animation: spin 22s linear infinite reverse; transform-origin: 960px 170px; }
      .dot  { animation: twinkle 3s ease-in-out infinite; }
      @keyframes flow   { to { stroke-dashoffset: -32; } }
      @keyframes pulse  { 0% { r: 10; opacity: .8 } 100% { r: 34; opacity: 0 } }
      @keyframes drift  { from { transform: translate(0,0) } to { transform: translate(60px, -30px) } }
      @keyframes sweep  { from { transform: translateX(-1200px) } to { transform: translateX(1200px) } }
      @keyframes fadeUp { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }
      @keyframes pop    { from { opacity: 0; transform: scale(.6) } to { opacity: 1; transform: scale(1) } }
      @keyframes spin   { to { transform: rotate(360deg) } }
      @keyframes twinkle{ 0%,100% { opacity: .2 } 50% { opacity: 1 } }
    </style>
  </defs>

  <!-- background -->
  <rect width="1200" height="340" rx="22" fill="url(#bg)"/>
  <g filter="url(#blur)">
    <circle class="orb"  cx="160" cy="80"  r="120" fill="url(#glowP)"/>
    <circle class="orb2" cx="1050" cy="300" r="140" fill="url(#glow)"/>
  </g>
  <rect class="sweep" width="1200" height="340" fill="url(#sweep)"/>

  <!-- subtle grid -->
  <g stroke="#ffffff" stroke-opacity="0.04">
    <path d="M0 60H1200M0 120H1200M0 180H1200M0 240H1200M0 300H1200"/>
    <path d="M120 0V340M240 0V340M360 0V340M480 0V340M600 0V340M720 0V340M840 0V340M960 0V340M1080 0V340"/>
  </g>

  <!-- stars -->
  <g fill="#e0e7ff">
    <circle class="dot" cx="90"  cy="300" r="1.6"/>
    <circle class="dot" cx="420" cy="40"  r="1.4" style="animation-delay:.7s"/>
    <circle class="dot" cx="700" cy="310" r="1.8" style="animation-delay:1.4s"/>
    <circle class="dot" cx="1150" cy="60" r="1.5" style="animation-delay:2.1s"/>
    <circle class="dot" cx="560" cy="200" r="1.2" style="animation-delay:.3s"/>
  </g>

  <!-- text block -->
  <g class="t">
    <text class="sub fade d1" x="70" y="96" style="fill:#67e8f9;font-size:15px;letter-spacing:4px;font-weight:700">SENIOR AI SOLUTION ARCHITECT</text>
    <text class="title fade d2" x="68" y="156">Muhammad Waseem Panhwar</text>
    <text class="sub fade d3" x="70" y="196">I design &amp; ship production AI — agents, RAG, LLM platforms, cloud.</text>

    <!-- pills -->
    <g class="fade d4">
      <g class="pill p1"><rect x="70"  y="228" width="104" height="30" rx="15" fill="#22d3ee"/><text class="tag" x="122" y="248" text-anchor="middle">AI Agents</text></g>
      <g class="pill p2"><rect x="184" y="228" width="72"  height="30" rx="15" fill="#a78bfa"/><text class="tag" x="220" y="248" text-anchor="middle">RAG</text></g>
      <g class="pill p3"><rect x="266" y="228" width="128" height="30" rx="15" fill="#f472b6"/><text class="tag" x="330" y="248" text-anchor="middle">LLM Platforms</text></g>
      <g class="pill p4"><rect x="404" y="228" width="106" height="30" rx="15" fill="#34d399"/><text class="tag" x="457" y="248" text-anchor="middle">AWS · GCP</text></g>
      <g class="pill p5"><rect x="520" y="228" width="140" height="30" rx="15" fill="#fbbf24"/><text class="tag" x="590" y="248" text-anchor="middle">15+ yrs Engineering</text></g>
    </g>
  </g>

  <!-- agent network (right side) -->
  <g>
    <!-- orbit rings -->
    <circle class="spinR" cx="960" cy="170" r="118" fill="none" stroke="#a78bfa" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="4 14"/>
    <circle class="spin"  cx="960" cy="170" r="78"  fill="none" stroke="#22d3ee" stroke-opacity="0.3"  stroke-width="1" stroke-dasharray="2 10"/>

    <!-- links -->
    <path class="link"   d="M960 170 L860 110"/>
    <path class="link p" d="M960 170 L1062 108"/>
    <path class="link"   d="M960 170 L1078 190"/>
    <path class="link p" d="M960 170 L1010 272"/>
    <path class="link"   d="M960 170 L880 262"/>
    <path class="link p" d="M960 170 L842 182"/>

    <!-- outer nodes -->
    <g>
      <circle class="pulse"   cx="860"  cy="110" r="10"/>
      <circle class="node"    cx="860"  cy="110" r="10"/>
      <circle class="pulse p" cx="1062" cy="108" r="10" style="animation-delay:.4s"/>
      <circle class="node p"  cx="1062" cy="108" r="10"/>
      <circle class="pulse"   cx="1078" cy="190" r="10" style="animation-delay:.8s"/>
      <circle class="node"    cx="1078" cy="190" r="10"/>
      <circle class="pulse p" cx="1010" cy="272" r="10" style="animation-delay:1.2s"/>
      <circle class="node p"  cx="1010" cy="272" r="10"/>
      <circle class="pulse"   cx="880"  cy="262" r="10" style="animation-delay:1.6s"/>
      <circle class="node"    cx="880"  cy="262" r="10"/>
      <circle class="pulse p" cx="842"  cy="182" r="10" style="animation-delay:2s"/>
      <circle class="node p"  cx="842"  cy="182" r="10"/>
    </g>

    <!-- core -->
    <circle cx="960" cy="170" r="40" fill="url(#glow)" opacity=".5"/>
    <circle cx="960" cy="170" r="24" fill="#0b1020" stroke="url(#title)" stroke-width="3"/>
    <text class="t" x="960" y="176" text-anchor="middle" font-size="16" font-weight="800" fill="#e0e7ff">AI</text>

    <!-- node labels -->
    <g class="t" font-size="11" fill="#94a3b8" font-weight="600">
      <text x="860"  y="92"  text-anchor="middle">Agents</text>
      <text x="1062" y="90"  text-anchor="middle">RAG</text>
      <text x="1104" y="194">MCP</text>
      <text x="1010" y="294" text-anchor="middle">Cloud</text>
      <text x="880"  y="284" text-anchor="middle">LLMs</text>
      <text x="814"  y="186" text-anchor="end">Data</text>
    </g>
  </g>
</svg>
