<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 64" width="1200" height="64" role="img" aria-label="Tech stack">
  <defs>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
