<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 150" width="1200" height="150" role="img" aria-label="Let's build something">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b1022"/><stop offset=".5" stop-color="#140f2e"/><stop offset="1" stop-color="#0b1022"/></linearGradient>
    <linearGradient id="wave1" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#67e8f9"/><stop offset=".5" stop-color="#c4b5fd"/><stop offset="1" stop-color="#f9a8d4"/></linearGradient>
    <clipPath id="c"><rect width="1200" height="150" rx="22"/></clipPath>
    <style>
      .f{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
      .t{font-size:26px;font-weight:900;fill:#f8fafc;letter-spacing:-.5px}
      .s{font-size:14px;fill:#aab4d4}
      .w{fill:none;stroke:url(#wave1);stroke-width:2;opacity:.5;animation:mv 9s linear infinite}
      .w2{animation-duration:13s;opacity:.3;animation-direction:reverse}
      .p{animation:pulse 2s ease-in-out infinite}
      @keyframes mv{from{transform:translateX(0)}to{transform:translateX(-400px)}}
      @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="150" fill="url(#bg)"/>
    <path class="w" d="M0 110 Q50 80 100 110 T200 110 T300 110 T400 110 T500 110 T600 110 T700 110 T800 110 T900 110 T1000 110 T1100 110 T1200 110 T1300 110 T1400 110 T1500 110 T1600 110"/>
    <path class="w w2" d="M0 125 Q50 100 100 125 T200 125 T300 125 T400 125 T500 125 T600 125 T700 125 T800 125 T900 125 T1000 125 T1100 125 T1200 125 T1300 125 T1400 125 T1500 125 T1600 125"/>
    <g class="f">
      <text class="t" x="600" y="62" text-anchor="middle">Let's build something that ships.</text>
      <text class="s" x="600" y="90" text-anchor="middle">AI architecture · agent &amp; RAG builds · advisory · speaking</text>
    </g>
    <circle class="p" cx="36" cy="30" r="4" fill="#6ee7b7"/>
    <text class="f" x="48" y="34" font-size="11" font-weight="700" fill="#6ee7b7" letter-spacing="2">OPEN TO WORK WITH SERIOUS TEAMS</text>
  </g>
</svg>
