<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 230" width="1200" height="230" role="img" aria-label="ActionMind AI — AI meeting teammate">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0b1022"/><stop offset="1" stop-color="#140f2e"/></linearGradient>
    <linearGradient id="border" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#67e8f9"><animate attributeName="stop-color" values="#67e8f9;#c4b5fd;#f9a8d4;#67e8f9" dur="6s" repeatCount="indefinite"/></stop>
      <stop offset="1" stop-color="#f9a8d4"><animate attributeName="stop-color" values="#f9a8d4;#67e8f9;#c4b5fd;#f9a8d4" dur="6s" repeatCount="indefinite"/></stop>
    </linearGradient>
    <radialGradient id="g" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#7c3aed" stop-opacity=".55"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></radialGradient>
    <filter id="soft"><feGaussianBlur stdDeviation="24"/></filter>
    <clipPath id="c"><rect width="1200" height="230" rx="22"/></clipPath>
    <style>
      .f{font-family:'Segoe UI',Inter,Roboto,Helvetica,Arial,sans-serif}
      .tag{font-size:11px;font-weight:800;letter-spacing:3px;fill:#67e8f9}
      .t{font-size:34px;font-weight:900;letter-spacing:-1px;fill:#f8fafc}
      .d{font-size:15px;fill:#aab4d4}
      .btn{font-size:13px;font-weight:800;fill:#05070f}
      .wave rect{animation:w 1.2s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:center}
      .wave rect:nth-child(2n){animation-delay:.2s}.wave rect:nth-child(3n){animation-delay:.4s}.wave rect:nth-child(5n){animation-delay:.1s}
      .task{animation:slideIn 6s ease-in-out infinite;opacity:0}
      .t1{animation-delay:0s}.t2{animation-delay:1.3s}.t3{animation-delay:2.6s}
      .tick{stroke-dasharray:20;stroke-dashoffset:20;animation:draw 6s ease-out infinite}
      .k1{animation-delay:.8s}.k2{animation-delay:2.1s}.k3{animation-delay:3.4s}
      .orb{animation:drift 12s ease-in-out infinite alternate}
      .shimmer{animation:sh 4s ease-in-out infinite}
      @keyframes w{from{transform:scaleY(.2)}to{transform:scaleY(1)}}
      @keyframes slideIn{0%{opacity:0;transform:translateX(16px)}10%,70%{opacity:1;transform:translateX(0)}85%,100%{opacity:0;transform:translateX(-16px)}}
      @keyframes draw{0%,12%{stroke-dashoffset:20}22%,70%{stroke-dashoffset:0}85%,100%{stroke-dashoffset:20}}
      @keyframes drift{from{transform:translate(0,0)}to{transform:translate(80px,20px)}}
      @keyframes sh{0%,100%{opacity:.5}50%{opacity:1}}
    </style>
  </defs>
  <g clip-path="url(#c)">
    <rect width="1200" height="230" fill="url(#bg)"/>
    <g filter="url(#soft)"><ellipse class="orb" cx="900" cy="120" rx="320" ry="140" fill="url(#g)"/></g>
    <rect x="1.5" y="1.5" width="1197" height="227" rx="21" fill="none" stroke="url(#border)" stroke-width="2.5" class="shimmer"/>

    <g class="f">
      <text class="tag" x="48" y="56">FEATURED · CO-FOUNDER</text>
      <text class="t" x="46" y="100">ActionMind AI</text>
      <text class="d" x="48" y="132">Your AI teammate joins the meeting, captures every decision,</text>
      <text class="d" x="48" y="154">turns talk into tasks — and executes the ones an API can do.</text>
      <g>
        <rect x="48" y="176" width="182" height="34" rx="17" fill="#67e8f9"/>
        <text class="btn" x="139" y="198" text-anchor="middle">meetactionmind.com →</text>
      </g>
    </g>

    <!-- meeting waveform -->
    <g class="wave" transform="translate(690,115)" fill="#67e8f9">
      <rect x="0" y="-20" width="5" height="40" rx="2"/><rect x="10" y="-26" width="5" height="52" rx="2"/><rect x="20" y="-14" width="5" height="28" rx="2"/>
      <rect x="30" y="-30" width="5" height="60" rx="2"/><rect x="40" y="-18" width="5" height="36" rx="2"/><rect x="50" y="-24" width="5" height="48" rx="2"/>
      <rect x="60" y="-10" width="5" height="20" rx="2"/><rect x="70" y="-28" width="5" height="56" rx="2"/><rect x="80" y="-16" width="5" height="32" rx="2"/>
      <rect x="90" y="-22" width="5" height="44" rx="2"/>
    </g>
    <path d="M800 115 H840" stroke="#c4b5fd" stroke-width="2" stroke-dasharray="4 4"/>
    <path d="M832 108l10 7-10 7z" fill="#c4b5fd"/>

    <!-- tasks popping -->
    <g class="f" font-size="14" font-weight="600" fill="#e2e8f0">
      <g transform="translate(860,70)"><g class="task t1">
        <rect width="290" height="34" rx="10" fill="#101633" stroke="#26305a"/>
        <rect x="10" y="9" width="16" height="16" rx="4" fill="none" stroke="#6ee7b7" stroke-width="2"/>
        <path class="tick k1" d="M13 17l4 4 7-8" fill="none" stroke="#6ee7b7" stroke-width="2.2" stroke-linecap="round"/>
        <text x="36" y="22">Create Jira ticket AC-142</text>
      </g></g>
      <g transform="translate(860,112)"><g class="task t2">
        <rect width="290" height="34" rx="10" fill="#101633" stroke="#26305a"/>
        <rect x="10" y="9" width="16" height="16" rx="4" fill="none" stroke="#6ee7b7" stroke-width="2"/>
        <path class="tick k2" d="M13 17l4 4 7-8" fill="none" stroke="#6ee7b7" stroke-width="2.2" stroke-linecap="round"/>
        <text x="36" y="22">Send recap to #product</text>
      </g></g>
      <g transform="translate(860,154)"><g class="task t3">
        <rect width="290" height="34" rx="10" fill="#101633" stroke="#26305a"/>
        <rect x="10" y="9" width="16" height="16" rx="4" fill="none" stroke="#6ee7b7" stroke-width="2"/>
        <path class="tick k3" d="M13 17l4 4 7-8" fill="none" stroke="#6ee7b7" stroke-width="2.2" stroke-linecap="round"/>
        <text x="36" y="22">Book follow-up · Thu 10:00</text>
      </g></g>
    </g>
  </g>
</svg>
